<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Site</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: Impact, "Arial Black", sans-serif;
  }
  video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  .pop-text {
    position: fixed;
    color: #fff;
    -webkit-text-stroke: 2px black;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 0 0 20px rgba(0,255,0,0.6);
    font-size: clamp(1.5rem, 5vw, 3.5rem);
    cursor: pointer;
    opacity: 0;
    transform: scale(0.3) rotate(-8deg);
    animation: pop 2.5s ease-in-out forwards;
    z-index: 2;
    user-select: none;
    white-space: nowrap;
  }

  @keyframes pop {
    0%   { opacity: 0; transform: scale(0.2) rotate(-15deg); }
    15%  { opacity: 1; transform: scale(1.3) rotate(5deg); }
    25%  { transform: scale(1) rotate(0deg); }
    80%  { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0; transform: scale(0.7) rotate(10deg); }
  }

  #soundBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 5;
    padding: 12px 18px;
    font-size: 1rem;
    font-family: sans-serif;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: 2px solid #fff;
    border-radius: 8px;
    cursor: pointer;
  }

  #copiedToast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #0f0;
    color: #000;
    font-family: sans-serif;
    font-weight: bold;
    padding: 10px 20px;
    border-radius: 6px;
    opacity: 0;
    transition: all 0.25s ease;
    z-index: 10;
    pointer-events: none;
  }
  #copiedToast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <video id="vid" autoplay muted loop playsinline>
    <source src="polishtoilet.mp4" type="video/mp4">
  </video>

  <button id="soundBtn" onclick="toggleSound()">🔇 Unmute</button>
  <div id="copiedToast">Copied!</div>

  
  <div id="textLayer"></div>

  <script>
   
    function toggleSound() {
      const vid = document.getElementById('vid');
      const btn = document.getElementById('soundBtn');
      vid.muted = !vid.muted;
      btn.textContent = vid.muted ? '🔇 Unmute' : '🔊 Mute';
    }

  
    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('copiedToast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1000);
      });
    }

    const phrases = [
      "CA: 000000000000"
     
    ];

    const layer = document.getElementById('textLayer');

    function spawnText() {
      const el = document.createElement('div');
      el.className = 'pop-text';
      const phrase = phrases[Math.floor(Math.random() * phrases.length)];
      el.textContent = phrase;

      // random position, keeping text mostly on-screen
      const top = Math.random() * 80 + 5;   // 5% - 85%
      const left = Math.random() * 70 + 5;  // 5% - 75%
      el.style.top = top + 'vh';
      el.style.left = left + 'vw';

      el.onclick = () => copyText(phrase);

      layer.appendChild(el);

      // remove after animation finishes
      setTimeout(() => el.remove(), 2500);
    }

    // spawn a new one every ~700ms, with slight randomness
    function loopSpawn() {
      spawnText();
      setTimeout(loopSpawn, 500 + Math.random() * 600);
    }
    loopSpawn();
  </script>

</body>
</html>
